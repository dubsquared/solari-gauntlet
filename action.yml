name: "Gauntlet Review"
description: >-
  Run an AI code review of any repo inside a Solari sandbox: build it, run its
  tests, probe it with a cloud browser, and publish a scored report with
  sealed evidence.
branding:
  icon: shield
  color: orange
inputs:
  repos:
    description: "Space-separated GitHub repo URLs to review. Defaults to the current repository at the current ref."
    required: false
    default: ""
  solari-api-key:
    description: "Solari API key (store as a secret)."
    required: true
  anthropic-api-key:
    description: "Anthropic API key (store as a secret)."
    required: true
  budget-tokens:
    description: "Hard token ceiling for the whole batch."
    required: false
    default: "150000"
  concurrency:
    description: "Parallel reviews (match your Solari plan's sandbox limit)."
    required: false
    default: "1"
  pr-comment:
    description: "For PR-URL targets, post/update a sticky verdict comment on the PR."
    required: false
    default: "false"
  github-token:
    description: "Token with pull-request write, for --pr-comment. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: dubsquared/solari-gauntlet
        path: .gauntlet
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - shell: bash
      working-directory: .gauntlet
      run: npm ci
    - shell: bash
      working-directory: .gauntlet
      env:
        SOLARI_API_KEY: ${{ inputs.solari-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        REPOS="${{ inputs.repos }}"
        COMMENT=""
        if [ -z "$REPOS" ]; then
          if [ -n "${GITHUB_EVENT_NAME}" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Behavioral-diff the PR itself, and post the verdict in the thread.
            REPOS="https://github.com/${GITHUB_REPOSITORY}/pull/$(jq -r .number "$GITHUB_EVENT_PATH")"
            [ "${{ inputs.pr-comment }}" = "true" ] && COMMENT="--pr-comment"
          else
            REPOS="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
          fi
        fi
        npm start -- --concurrency "${{ inputs.concurrency }}" \
          --budget-tokens "${{ inputs.budget-tokens }}" $COMMENT $REPOS
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: gauntlet-reports
        path: .gauntlet/reports/
