name: selftest
# Manual only: this boots a REAL Solari sandbox (costs sandbox minutes, zero
# tokens) and runs commands designed to fail, asserting the harness reports
# each one honestly. Needs a SOLARI_API_KEY repository secret.
on:
  workflow_dispatch:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run selftest
        env:
          SOLARI_API_KEY: ${{ secrets.SOLARI_API_KEY }}
