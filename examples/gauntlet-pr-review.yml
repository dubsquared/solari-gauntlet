# Drop this in .github/workflows/ of any repo: every PR gets a Gauntlet
# BEHAVIORAL-DIFF review — base and head both built, tested, and probed in one
# Solari sandbox — and the verdict is posted as a single self-updating comment
# on the PR. The full evidence bundle is attached as an artifact.
name: gauntlet
on: pull_request
permissions:
  contents: read
  pull-requests: write   # for the sticky verdict comment
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: dubsquared/solari-gauntlet@main
        with:
          solari-api-key: ${{ secrets.SOLARI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          budget-tokens: 60000
          pr-comment: true
